name: Atualizar catálogo

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog-sources/**' # roda ao editar a lista manual de magnets

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write # necessário para commitar o catalog.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Executar varredor
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAX_TITLES_PER_RUN: ${{ vars.MAX_TITLES_PER_RUN || '100' }}
          ENABLE_INTERNET_ARCHIVE: ${{ vars.ENABLE_INTERNET_ARCHIVE || '1' }}
        run: python scraper/main.py

      - name: Commit do catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/catalog.json
          if git diff --cached --quiet; then
            echo "Catálogo sem mudanças."
            exit 0
          fi
          git commit -m "chore(catalog): atualização automática"
          git pull origin main --no-rebase -X ours
          git push
